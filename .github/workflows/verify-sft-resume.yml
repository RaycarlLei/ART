name: Verify SFT resume

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 6f11634280192dd4664f634b61a681cfe30c77ac
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked development environment
        run: |
          python -m pip install uv==0.11.17
          uv sync --locked --group dev
      - name: Verify contribution commit
        run: test "$(git rev-parse HEAD)" = "6f11634280192dd4664f634b61a681cfe30c77ac"
      - name: Run repository quality checks
        run: |
          uv run prek run --all-files
          git diff --exit-code
      - name: Run SFT unit tests
        run: uv run pytest tests/unit/test_sft.py -q --tb=short
